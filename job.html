<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Job Details</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { margin:0; font-family: Arial, sans-serif; background:#f4f6f9; }
    header { background:#0b5ed7; color:#fff; padding:15px; text-align:center; }
    .container { max-width:800px; margin:auto; padding:15px; }
    .card {
      background:#fff;
      border-radius:10px;
      padding:15px;
      box-shadow:0 2px 6px rgba(0,0,0,0.1);
    }
    .title { font-size:22px; font-weight:bold; color:#0b5ed7; }
    .meta { color:#666; margin:8px 0; }
    .btn {
      display:inline-block;
      margin-top:10px;
      padding:10px 16px;
      background:#0b5ed7;
      color:#fff;
      border-radius:6px;
      text-decoration:none;
    }
  </style>
</head>
<body>

<header>
  <h2>Job Details</h2>
</header>

<div class="container">
  <div class="card" id="job">Loading...</div>
</div>

<script>
const API_BASE = "https://sarkari-jobs-api-scby.onrender.com/api/job/";
const params = new URLSearchParams(window.location.search);
const id = params.get("id");

async function loadJob() {
  try {
    const res = await fetch(API_BASE + id);
    const job = await res.json();

    document.getElementById("job").innerHTML = `
      <div class="title">${job.title}</div>
      <div class="meta">${job.category} | ${job.date}</div>
      <p>This job information is collected from public sources. Always verify on the official website.</p>
      <a class="btn" href="${job.link}" target="_blank">Apply / View Official Notice</a>
    `;
  } catch (err) {
    document.getElementById("job").innerHTML = "❌ Job not found.";
  }
}

loadJob();
</script>

</body>
</html>
